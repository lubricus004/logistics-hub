<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promoter Login — Logistics Hub</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --border: rgba(0,0,0,0.08);
    --radius: 18px;
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 28px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #34c759, #30d158);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 28px;
    box-shadow: 0 8px 20px rgba(52, 199, 89, 0.25);
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-align: center;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.95rem;
    line-height: 1.45;
    margin-bottom: 32px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.01em;
  }

  .form-group input {
    width: 100%;
    padding: 16px 18px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: #fafafa;
    font-size: 1.05rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: all 0.2s ease;
  }

  .form-group input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
  }

  .form-group input::placeholder {
    color: #aeaeb2;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
  }

  .btn:hover {
    background: var(--accent-hover);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .toast {
    background: #ff3b30;
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 24px;
    text-align: center;
  }

  @media (min-width: 600px) {
    .card {
      padding: 48px 40px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">👤</div>
    <h1>Promoter Login</h1>
    <p class="subtitle">Enter your phone number and PIN to see your stock and leaderboard.</p>

    {% if messages %}
      {% for msg in messages %}
        <div class="toast">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone_number" placeholder="e.g. 0248123456" required autofocus>
      </div>
      <div class="form-group">
        <label>4-Digit PIN</label>
        <input type="password" name="pin" placeholder="••••" maxlength="4" pattern="[0-9]{4}" required>
      </div>
      <button type="submit" class="btn">Continue</button>
    </form>
  </div>
</body>
</html>
