<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Profile — Logistics Hub</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 28px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-align: center;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: #fafafa;
    font-size: 1.05rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: all 0.2s ease;
  }

  .form-group input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
  }

  .btn:hover { background: #0077ed; }
  .btn:active { transform: scale(0.98); }

  .link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
  }

  .toast {
    background: #34c759;
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 24px;
    text-align: center;
  }

  .toast.error {
    background: #ff3b30;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>👤 My Profile</h1>

    {% if messages %}
      {% for msg in messages %}
        <div class="toast {% if 'error' in msg.tags %}error{% endif %}">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" value="{{ user.email }}" required>
      </div>
      <div class="form-group">
        <label>New Password <span style="font-weight:400; color:var(--text-secondary)">(leave blank to keep current)</span></label>
        <input type="password" name="password" placeholder="Enter new password">
      </div>
      <button type="submit" class="btn">Save Changes</button>
    </form>

    <a href="{% url 'dashboard' %}" class="link">← Back to Dashboard</a>
  </div>
</body>
</html>
