<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Logistics Hub</title>
<style>
body { font-family: system-ui, sans-serif; background: #f0fdf4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
h2 { color: #166534; margin-top: 0; text-align: center; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 600; color: #374151; }
input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
.btn { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
.btn:hover { background: #15803d; }
.link { text-align: center; margin-top: 15px; display: block; color: #16a34a; text-decoration: none; font-weight: 600; }
.error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
</style>
</head>
<body>
<div class="card">
    <h2> Create Shop Account</h2>
    {% if messages %}
        {% for msg in messages %}<div class="error">{{ msg }}</div>{% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Shop Name</label>
            <input type="text" name="shop_name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
               <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn">Create Account</button>
    </form>
    <a href="{% url 'shop_login' %}" class="link">Already have an account? Login</a>
</div>
</body>
</html>
